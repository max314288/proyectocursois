# ===================================================================
# CONFIGURACIÓN PRINCIPAL — Comida al Paso API
# ===================================================================

# ───── Servidor ─────
server.port=8080
spring.application.name=comidaalpaso-api

# ───── SQL Server: instancia SQLEXPRESS local, BD bdAppcomida ─────
# Nota: \\ es el escape Java de un solo backslash en el connection string
spring.datasource.url=jdbc:sqlserver://MaxPcGamer\\SQLEXPRESS:1433;databaseName=bdAppcomida;encrypt=true;trustServerCertificate=true
spring.datasource.username=comidaalpaso_app
spring.datasource.password=C0midaLpas00906!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ───── JPA / Hibernate ─────
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
# El schema lo gestiona el usuario vía sql_usuario.sql — Hibernate NO toca la BD
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ───── JWT ─────
# JWT_SECRET debe ser ≥ 32 bytes (256 bits para HS256)
# Generar en PowerShell:
#   [Convert]::ToBase64String((1..32 | ForEach-Object { Get-Random -Maximum 256 }))
jwt.secret=${JWT_SECRET:cambia-este-secreto-por-uno-real-de-al-menos-32-bytes-base64}
jwt.expiration-ms=86400000

# ───── CORS — 3 frontends Next.js ─────
cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002

# ───── OpenAPI / Swagger UI ─────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ───── Logging ─────
logging.level.org.springframework.security=INFO
logging.level.com.comidaalpaso=DEBUG
